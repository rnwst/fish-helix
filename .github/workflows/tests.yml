name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run fish-helix tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:fish-shell/release-4
          sudo apt-get update
          sudo apt-get install -y fish tmux inotify-tools perl
          fish --version

      - name: Run tests
        run: ./run-tests
